name: center_action_navbar
description: >-
  A customizable Flutter bottom navigation bar with a floating center action
  button, notched pill container, and smooth selection animations.
version: 0.1.0
homepage: https://github.com/MEHMETCOBANOGLU/center_action_navbar
repository: https://github.com/MEHMETCOBANOGLU/center_action_navbar
issue_tracker: https://github.com/MEHMETCOBANOGLU/center_action_navbar/issues

environment:
  sdk: ^3.5.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

topics:
  - navbar
  - navigation
  - bottom-navigation
  - flutter-ui
  - animation

flutter:
  uses-material-design: true
